<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHI MIN — Industrial Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Caveat:wght@500;700&amp;display=swap" rel="stylesheet">
<style>

body{margin:0;background:#0A0A0F}
a{color:#FF2D8D}a:hover{color:#FF6BAE}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
@keyframes ovOut{from{opacity:1}to{opacity:0}}
@keyframes panelIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes dotPulse{0%{box-shadow:0 0 0 0 rgba(255,45,141,.55)}70%{box-shadow:0 0 0 10px rgba(255,45,141,0)}100%{box-shadow:0 0 0 0 rgba(255,45,141,0)}}
.hs{position:absolute;padding:0;margin:0;background:transparent;border:1px solid transparent;border-radius:8px;cursor:pointer;transition:border-color .25s ease,box-shadow .25s ease,background-color .25s ease}
.hs:hover,.hs:focus-visible{outline:none;z-index:6}
.hs-box:hover,.hs-box:focus-visible{border-color:rgba(255,45,141,.9);background-color:rgba(255,45,141,.05);box-shadow:0 0 0 1px rgba(255,45,141,.25),0 0 28px rgba(255,45,141,.28)}
.lift{position:absolute;display:block;max-width:none;pointer-events:none;opacity:0;transform-origin:50% 55%;will-change:transform;transition:opacity .15s ease}
.hs:hover .lift,.hs:focus-visible .lift{opacity:1;filter:drop-shadow(0 16px 18px rgba(0,0,0,.55)) drop-shadow(0 0 12px rgba(255,45,141,.28));animation:liftIn .45s cubic-bezier(.2,.7,.2,1) both,floatBob 3s ease-in-out .45s infinite}
.lift-slide{position:absolute;display:block;max-width:none;pointer-events:none;transform-origin:50% 55%;transition:opacity .9s ease}
.hs:hover .lift-slide,.hs:focus-visible .lift-slide{animation:liftIn .45s cubic-bezier(.2,.7,.2,1) both,floatBob 3s ease-in-out .45s infinite}
.name-shine{-webkit-mask:url(assets/cd4845050be8b9b03fa5b7933ad028e6.png) center / 100% 100% no-repeat;mask:url(assets/cd4845050be8b9b03fa5b7933ad028e6.png) center / 100% 100% no-repeat;background:linear-gradient(110deg,rgba(255,45,141,0) 0%,rgba(255,45,141,0) 41%,rgba(255,45,141,.85) 46%,#FFFFFF 50%,rgba(255,214,236,.9) 53%,rgba(255,45,141,0) 58%,rgba(255,45,141,0) 100%);background-size:300% 100%;background-repeat:no-repeat;animation:nameShine 10s cubic-bezier(.45,.05,.35,1) 1.2s infinite}
@keyframes nameShine{0%{background-position:100% 0}22%,100%{background-position:0% 0}}
.car-btn{transition:background-color .2s ease,border-color .2s ease}
.car-btn:hover,.car-btn:focus-visible{outline:none;background-color:#FF2D8D;border-color:#FF2D8D}
.dust{position:absolute;display:block;animation-timing-function:ease-in-out;animation-iteration-count:infinite;will-change:transform,opacity}
.dust-core{position:absolute;inset:0;display:block;border-radius:50%;box-shadow:0 0 6px rgba(255,214,140,.9),0 0 12px rgba(212,175,55,.55);animation-name:dustTwinkle;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@keyframes dustA{0%{transform:translate3d(0,0,0);opacity:0}18%{opacity:1}50%{transform:translate3d(14px,-40px,0)}82%{opacity:1}100%{transform:translate3d(6px,-90px,0);opacity:0}}
@keyframes dustB{0%{transform:translate3d(0,0,0);opacity:0}18%{opacity:1}50%{transform:translate3d(-12px,-30px,0)}82%{opacity:1}100%{transform:translate3d(18px,-70px,0);opacity:0}}
@keyframes dustC{0%{transform:translate3d(0,0,0);opacity:0}20%{opacity:1}50%{transform:translate3d(26px,-22px,0)}80%{opacity:1}100%{transform:translate3d(40px,-56px,0);opacity:0}}
@keyframes dustD{0%{transform:translate3d(0,0,0);opacity:0}16%{opacity:1}50%{transform:translate3d(-6px,-52px,0)}84%{opacity:1}100%{transform:translate3d(-20px,-110px,0);opacity:0}}
@keyframes dustTwinkle{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes pageOut{0%{transform:perspective(1800px) rotateY(0deg);opacity:1;filter:brightness(1)}55%{filter:brightness(.8)}100%{transform:perspective(1800px) rotateY(-118deg);opacity:0;filter:brightness(.65)}}
@keyframes pageIn{0%{transform:perspective(1800px) rotateY(-118deg);opacity:0;filter:brightness(.65)}45%{filter:brightness(.8)}100%{transform:perspective(1800px) rotateY(0deg);opacity:1;filter:brightness(1)}}
.page-corner:hover svg,.page-corner:focus-visible svg{transform:translate(-3px,-3px) scale(1.12);transform-origin:100% 100%;transition:transform .25s ease}
.lift-d{display:none}
.is-day .lift-d{display:block}
.is-day .lift-n{display:none}
@keyframes kkWiggle{0%{transform:rotate(0) scale(1)}20%{transform:rotate(-6deg) scale(1.06)}40%{transform:rotate(5deg) scale(1.06)}60%{transform:rotate(-3deg) scale(1.04)}80%{transform:rotate(2deg) scale(1.02)}100%{transform:rotate(0) scale(1)}}
.lip-sw{opacity:0;pointer-events:none;transition:opacity .25s ease}
.lip-wrap:hover .lip-sw,.lip-wrap:focus-within .lip-sw{opacity:1;pointer-events:auto}
.lip-wrap:hover,.lip-wrap:focus-within{z-index:6}
.obj{position:absolute;inset:0;display:block;width:100%;height:100%;max-width:none;pointer-events:none;transform-origin:50% 60%;will-change:transform}
.hs:hover .obj,.hs:focus-visible .obj,.deco:hover .obj{filter:drop-shadow(0 16px 18px rgba(0,0,0,.6)) drop-shadow(0 0 12px rgba(255,45,141,.28));animation:liftIn .45s cubic-bezier(.2,.7,.2,1) both,floatBob 3s ease-in-out .45s infinite}
.nb-thumb{position:relative;transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.nb-thumb:hover,.nb-thumb:focus-visible{outline:none;z-index:2;transform:rotate(0deg) translateY(-4px) scale(1.06) !important}
.nb-thumb:focus-visible img{outline:2px solid #FF2D8D;outline-offset:2px}
.gal-card{transition:border-color .2s ease,transform .25s ease}
.gal-card:hover,.gal-card:focus-visible{outline:none;border-color:#FF2D8D;transform:translateY(-3px)}
.be-btn{transition:background-color .2s ease,color .2s ease}
.be-btn:hover,.be-btn:focus-visible{outline:none;background-color:#FFFFFF;color:#0A0A0F}
@keyframes liftIn{from{transform:translateY(0) scale(1)}to{transform:translateY(-1.6%) scale(1.045)}}
@keyframes floatBob{0%,100%{transform:translateY(-1.6%) scale(1.045) rotate(0deg)}50%{transform:translateY(-2.3%) scale(1.05) rotate(-.4deg)}}
@keyframes objPop{0%{transform:translateY(-1.6%) scale(1.045)}45%{transform:translateY(-4%) scale(1.085)}100%{transform:translateY(-3%) scale(1.07)}}
@media (prefers-reduced-motion: reduce){.dust-field{display:none}.name-shine{animation:none;opacity:0}.hs:hover .lift-slide{animation:none}.lip-wrap:hover .obj{animation:none}.hs:hover .lift,.hs:focus-visible .lift,.hs:hover .obj,.deco:hover .obj{animation:none;transform:translateY(-1%) scale(1.03)}}
.hs .hs-tag{opacity:0;transform:translateY(4px);transition:opacity .25s ease,transform .25s ease}
.hs:hover .hs-tag,.hs:focus-visible .hs-tag{opacity:1;transform:none}
.hs .hs-dot{animation:dotPulse 2.6s ease-out infinite}
.close-btn{transition:background-color .2s ease,border-color .2s ease,color .2s ease}
.close-btn:hover,.close-btn:focus-visible{outline:none;background-color:#FF2D8D;border-color:#FF2D8D;color:#0A0A0F}
.close-btn:disabled{cursor:default;pointer-events:none}
@keyframes bookSlide{from{transform:translateX(-25%)}to{transform:translateX(0)}}
@keyframes bookSlideBack{from{transform:translateX(0)}to{transform:translateX(-25%)}}
@keyframes coverFlip{from{transform:rotateY(0deg)}to{transform:rotateY(-180deg)}}
@keyframes coverFlipBack{from{transform:rotateY(-180deg)}to{transform:rotateY(0deg)}}
@keyframes leafNext{from{transform:rotateY(0deg)}to{transform:rotateY(-180deg)}}
@keyframes leafPrev{from{transform:rotateY(0deg)}to{transform:rotateY(180deg)}}
@keyframes inkIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.paper{background-color:#EFEBE3;background-image:radial-gradient(#CFC8BA 1px,transparent 1.3px);background-size:22px 22px}
.pg-r{background-image:linear-gradient(to right,rgba(0,0,0,.16),rgba(0,0,0,0) 9%),radial-gradient(#CFC8BA 1px,transparent 1.3px);background-size:100% 100%,22px 22px}
.pg-l{background-image:linear-gradient(to left,rgba(0,0,0,.16),rgba(0,0,0,0) 9%),radial-gradient(#CFC8BA 1px,transparent 1.3px);background-size:100% 100%,22px 22px}
.hand{font-family:Caveat,'Comic Sans MS',cursive;color:#2B2B33;font-weight:500}
.ink-h{font-family:Caveat,cursive;font-weight:700;color:#C8146A}
.ink-mark{background:linear-gradient(transparent 58%,rgba(255,45,141,.32) 58%)}
.sw-btn{transition:background-color .2s ease,border-color .2s ease,color .2s ease}
.sw-btn:hover,.sw-btn:focus-visible{outline:none;border-color:#FF2D8D;color:#FFFFFF}
.ov-scroll::-webkit-scrollbar{width:8px}.ov-scroll::-webkit-scrollbar-thumb{background:#2A2A34;border-radius:8px}

html,body{margin:0;background:#0A0A0F}
</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/preact.min.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
